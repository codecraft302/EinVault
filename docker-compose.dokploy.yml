version: '3.8'

services:
  einvault:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000'
    environment:
      ORIGIN: https://einvault.codecraft302.pp.ua
      NODE_ENV: production
      DATABASE_URL: /data/einvault.db
      UPLOAD_MAX_MB: '10'
      VIDEO_MAX_MB: '100'
      MAX_DAILY_MEDIA: '5'
      MAX_DOCUMENTS_PER_COMPANION: '200'
      REMINDER_UNDO_SECONDS: '7'
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      PAPERLESS_TAG_ID: ${PAPERLESS_TAG_ID}
    volumes:
      - einvault_data:/data
    user: 1000:1000
    networks:
      - dokploy-network
      - default
volumes:
  einvault_data: null

networks:
  dokploy-network:
    external: true
