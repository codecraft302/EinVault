version: "3.8"

services:
  einvault:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      ORIGIN: https://einvault.codecraft302.pp.ua
      NODE_ENV: production
      DATABASE_URL: /data/einvault.db
      UPLOAD_MAX_MB: "10"
      VIDEO_MAX_MB: "100"
      MAX_DAILY_MEDIA: "5"
      MAX_DOCUMENTS_PER_COMPANION: "200"
      REMINDER_UNDO_SECONDS: "7"
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      PAPERLESS_TAG_ID: ${PAPERLESS_TAG_ID}
    volumes:
      - einvault_data:/data
    user: 1000:1000
    networks:
      - dokploy-network
      - default
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.einvault-ddpep8-12-web.rule=Host(`einvault.codecraft302.pp.ua`)
      - traefik.http.routers.einvault-ddpep8-12-web.entrypoints=web
      - traefik.http.services.einvault-ddpep8-12-web.loadbalancer.server.port=3000
      - traefik.http.routers.einvault-ddpep8-12-web.service=einvault-ddpep8-12-web
      - traefik.http.routers.einvault-ddpep8-12-web.middlewares=redirect-to-https@file
      - traefik.http.routers.einvault-ddpep8-12-websecure.rule=Host(`einvault.codecraft302.pp.ua`)
      - traefik.http.routers.einvault-ddpep8-12-websecure.entrypoints=websecure
      - traefik.http.services.einvault-ddpep8-12-websecure.loadbalancer.server.port=3000
      - traefik.http.routers.einvault-ddpep8-12-websecure.service=einvault-ddpep8-12-websecure
      - traefik.http.routers.einvault-ddpep8-12-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true

volumes:
  einvault_data: null

networks:
  dokploy-network:
    external: true
